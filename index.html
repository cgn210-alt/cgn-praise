<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EM1</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="description" content="CGN 아침 예배 찬양팀 명단 · 월별 예배 담당 · 섬김 기록과 결산" />
<meta property="og:title" content="EM1" />
<meta property="og:description" content="매일 아침, 오직 한 분께 · Every morning, for the One alone" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://cgn210-alt.github.io/cgn-praise/praise-og.png?v=4" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #122a42; --navy2: #2b4a6d; --gold: #c89b55; --gold-d: #a8793a; --gold-l: #f3e6cc;
    --bg: #f8f1e4; --card: #fffdf9; --line: #ecdfc8; --text: #122a42; --muted: #6f7787;
    --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif; min-height: 100vh;
    background:
      radial-gradient(700px 480px at 12% 100%, rgba(200,155,85,0.22), transparent 70%),
      radial-gradient(800px 520px at 100% 0%, rgba(200,155,85,0.12), transparent 70%),
      linear-gradient(180deg, #fffdf8 0%, var(--bg) 100%);
    background-attachment: fixed;
    color: var(--text); font-size: 15px; line-height: 1.5; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, .btn { cursor: pointer; white-space: nowrap; }
  .hidden { display: none !important; }

  header.top {
    background: linear-gradient(135deg, #0c1d30 0%, var(--navy) 50%, #1f3d5e 100%);
    border-bottom: 2px solid rgba(200,155,85,0.6);
    color: #fff; padding: 18px 16px 14px;
  }
  .top-in { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo { height: 40px; width: auto; flex: none; }
  .brand { min-width: 0; padding-left: 12px; border-left: 1px solid rgba(200,155,85,0.55); }
  .top h1 { margin: 0; font-size: 19px; font-weight: 900; letter-spacing: -0.02em; white-space: nowrap; }
  .top h1 span { color: #e3b871; }
  @media (max-width: 480px) {
    .logo { height: 32px; }
    .brand { padding-left: 10px; }
    .top h1 { font-size: 15px; }
    .top .sub { font-size: 11px; }
    .top .sub .en { display: none; }
  }
  .top .sub { font-size: 12.5px; color: #cfd6df; }
  .top .who { margin-left: auto; text-align: right; font-size: 12.5px; color: #e6e9ee; }
  .top .who .role { display: inline-block; font-size: 11px; color: #3b2405; background: #e3b871; border-radius: 10px; padding: 0 7px; margin-left: 2px; }
  .top .who .role:empty { display: none; }
  .roles div { margin-top: 4px; }
  .top .who button { margin-top: 2px; background: rgba(255,255,255,0.14); border: 0; color: #fff; border-radius: 8px; padding: 3px 10px; font-size: 12px; }

  nav.tabs { position: sticky; top: 0; z-index: 20; background: rgba(255,253,248,0.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .tabs-in { max-width: 960px; margin: 0 auto; display: flex; overflow-x: auto; }
  .tabs button { flex: 1 0 auto; background: none; border: 0; padding: 12px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--navy); border-bottom-color: var(--gold); }
  .tabs a { flex: 1 0 auto; padding: 12px 14px; font-weight: 700; color: var(--muted); text-decoration: none; text-align: center; border-bottom: 3px solid transparent; white-space: nowrap; }

  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(18,42,66,0.04); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  h2.sec { font-size: 17px; margin: 18px 0 10px; }
  h3.part { font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  h3.part .cnt { font-size: 12.5px; color: var(--muted); font-weight: 500; }

  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
  .btn.pri { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
  .btn.bad { color: var(--bad); }
  .btn.sm { padding: 4px 9px; font-size: 13px; border-radius: 8px; }
  a.btn { display: inline-block; text-decoration: none; color: var(--navy); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; padding: 6px 14px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--navy); color: #fff; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], select, textarea {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; width: 100%; outline-color: var(--gold);
  }
  textarea { min-height: 70px; resize: vertical; }
  label.f { display: block; font-size: 13px; color: var(--muted); font-weight: 700; margin: 10px 0 4px; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 20px; background: #f1eadc; color: var(--muted); }
  .badge.guest { background: #e0f2fe; color: #0369a1; }
  .badge.parental, .badge.leave { background: #fef3c7; color: #92400e; }
  .badge.retired { background: #f1f1f1; color: #888; }
  .badge.type { background: #e8edf3; color: var(--navy2); }
  .badge.title { background: var(--gold-l); color: #84591f; }
  .badge { white-space: nowrap; }

  /* 공지 */
  .notice { background: #fdf5e6; border: 1px solid #ead3a6; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; font-size: 14px; }

  /* 월 이동 */
  .monthbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .monthbar .ym { font-size: 19px; font-weight: 900; min-width: 118px; text-align: center; white-space: nowrap; }
  .dt { flex: none; width: 92px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .monthbar .nav { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 18px; color: var(--navy); }

  /* 예배 카드 */
  .ev { display: flex; gap: 12px; }
  .ev.past { opacity: 0.78; }
  .past-sep { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .past-sep:before, .past-sep:after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .ev.today { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,155,85,0.25); }
  .ev .date { flex: none; width: 54px; text-align: center; border-radius: 12px; background: var(--gold-l); padding: 6px 0; align-self: flex-start; }
  .ev .date b { display: block; font-size: 20px; line-height: 1.1; color: var(--navy); }
  .ev .date span { font-size: 12px; color: var(--muted); }
  .ev .date.sat span { color: var(--navy2); }
  .ev .body { flex: 1; min-width: 0; }
  .ev .title { font-weight: 900; font-size: 15.5px; }
  .slots { margin-top: 6px; display: grid; grid-template-columns: 52px 1fr; gap: 4px 8px; font-size: 14px; }
  .slots .lb { color: var(--muted); font-size: 12.5px; font-weight: 700; padding-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: #f4eee3; border-radius: 20px; padding: 2px 9px 2px 2px; font-size: 13.5px; }
  .chip.me { background: #f0dcb4; font-weight: 700; }
  .chip.absent { text-decoration: line-through; opacity: 0.55; }
  .chip .av { width: 22px; height: 22px; }
  .chip x { cursor: pointer; color: var(--muted); padding-left: 2px; font-style: normal; }

  /* 얼굴 사진 */
  .av { border-radius: 50%; overflow: hidden; flex: none; background: linear-gradient(135deg, #3a5a7c, var(--navy)); color: #f3e6cc; display: grid; place-items: center; font-weight: 700; font-size: 11px; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo { aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: linear-gradient(160deg, #e9dcc3, #c9a96f); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 900; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { fill: currentColor; opacity: 0.85; align-self: end; }
  .av .ph { width: 82%; height: 82%; }
  .photo .ph { width: 74%; height: 74%; }

  /* 명단 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  @media (max-width: 480px) {
    .tabs button, .tabs a { padding: 12px 8px; font-size: 14px; }
    .grid { gap: 8px; }
  }
  .mem { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px; text-align: center; cursor: pointer; }
  .mem:hover { border-color: var(--gold); }
  .mem .nm { font-weight: 700; margin-top: 6px; font-size: 14.5px; }
  .mem .meta { font-size: 11.5px; color: var(--muted); min-height: 17px; }
  .mem.off .photo { filter: grayscale(0.7); opacity: 0.75; }

  /* 통계 */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile .k { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .tile .v { font-size: 22px; font-weight: 900; color: var(--navy); }
  .tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); }
  table.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rank th, table.rank td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  table.rank th { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  table.rank td.l, table.rank th.l { text-align: left; }
  table.rank tr.top td { background: #fbf2e1; }
  .tbl-wrap { overflow-x: auto; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 10px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--muted); }
  .bars .b i { display: block; width: 100%; max-width: 28px; background: linear-gradient(180deg, var(--gold), var(--gold-d)); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bars .b em { font-style: normal; font-size: 11px; color: var(--text); }
  .award { background: linear-gradient(135deg, #fbefd6, var(--card)); border: 1px solid #e6cc9a; }
  .award .who { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .award .who div { text-align: center; width: 72px; font-size: 13px; font-weight: 700; }
  .award .msg { white-space: pre-wrap; margin-top: 8px; font-size: 14px; }

  /* 배지 */
  .bimg { display: inline-block; border-radius: 50%; flex: none; object-fit: contain; vertical-align: middle; }
  .bimg.card { background: var(--gold-l); color: #7a4f14; display: inline-grid; place-items: center; border: 1.5px solid var(--gold); }
  .bimg.card svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; }
  .bhit { display: inline-flex; cursor: pointer; border-radius: 50%; }
  .bhit:hover .bimg, .bhit:hover .slot { box-shadow: 0 0 0 3px rgba(200,155,85,0.35); }
  .meaning { text-align: center; }
  .meaning .mbig { display: inline-block; margin-bottom: 6px; }
  .meaning h3 { margin: 4px 0 0; }
  .coll { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .coll .slot { border-radius: 50%; border: 1.5px dashed #d8c7a6; color: #b9a686; font-size: 10px; display: inline-grid; place-items: center; flex: none; }
  .coll .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
  .mini-b { display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; margin-top: 4px; }
  .hero { background: linear-gradient(135deg, #fffdf8, #f6ead2); border-color: #e6cc9a; }
  .hero-logo { height: 44px; width: auto; flex: none; }
  .feed .msg, .mybadge .msg, .card .msg { margin-top: 6px; padding: 6px 10px; background: #fbf3e3; border-radius: 8px; white-space: pre-wrap; }
  .cheers { margin-top: 8px; }
  .cheer { font-size: 13.5px; padding: 3px 0; border-top: 1px dashed var(--line); }
  .cheer x { cursor: pointer; color: var(--muted); font-style: normal; padding-left: 4px; }
  .cheer-in { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .cheer-own { display: flex; gap: 4px; flex: 1 1 200px; }
  .cheer-own input { padding: 4px 8px; font-size: 13px; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .bcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; }
  .bcard:hover { border-color: var(--gold); }
  .bcard.me { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,155,85,0.18); }
  .att-list .row { padding: 4px 0; border-bottom: 1px dashed var(--line); flex-wrap: nowrap; }
  .doc { padding: 6px 0; border-top: 1px dashed var(--line); flex-wrap: nowrap; }
  td.ok-cell { background: #f6e6c3; }
  table.rank tr.grp td { background: var(--gold-l); color: #84591f; font-weight: 700; font-size: 12.5px; padding: 5px 6px; }

  /* 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(12,29,48,0.5); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; }
  .modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 520px; padding: 18px; }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px 10px; }
  .checks label { display: flex; align-items: center; gap: 6px; font-size: 14px; }

  /* 사진 자르기 */
  .crop { width: 240px; height: 320px; margin: 8px auto; position: relative; overflow: hidden; border-radius: 10px; background: #222; touch-action: none; cursor: grab; }
  .crop img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; max-width: none; }

  /* 로그인 */
  .auth { max-width: 380px; margin: 40px auto; }
  .auth .card { padding: 20px; }
  .msg-err { color: var(--bad); font-size: 13.5px; margin-top: 8px; min-height: 20px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1c2033; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 80; }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <img class="logo" src="em1-mark-white.png" alt="EM1" />
    <div class="brand">
      <h1>매일 아침, <span>오직 한 분께</span></h1>
      <div class="sub">CGN 찬양팀<span class="en"> · Every morning, for the One alone</span></div>
    </div>
    <div class="who hidden" id="who"></div>
  </div>
</header>

<nav class="tabs hidden" id="tabs"><div class="tabs-in">
  <button data-tab="sched">예배 담당</button>
  <button data-tab="roster">명단</button>
  <button data-tab="stats">결산</button>
  <button data-tab="badges">배지</button>
  <button data-tab="mine">내 기록</button>
  <a href="guide.html">안내</a>
  <button data-tab="admin" class="hidden" id="tab-admin">관리</button>
</div></nav>

<main id="main"><p class="muted">불러오는 중…</p></main>

<script src="firebase-config.js?v=1"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="praise.js?v=19"></script>
</body>
</html>
