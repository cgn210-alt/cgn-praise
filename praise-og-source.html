<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<!-- 카카오톡 등 링크 공유 썸네일(praise-og.png) 원본. 1200x630 으로 캡처해서 PNG 로 저장 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Noto Sans KR', sans-serif;
    position:relative;
    background:
      radial-gradient(520px 420px at 930px 640px, rgba(242,169,59,0.55), transparent 70%),
      linear-gradient(160deg, #141b42 0%, #1f2a5c 50%, #33449a 100%);
  }
  .frame { position:absolute; inset:22px; border:2px solid rgba(255,255,255,0.25); border-radius:18px; }
  .pill {
    position:absolute; top:64px; left:68px;
    font-size:18px; font-weight:700; letter-spacing:0.18em;
    color:#3b2405; background:#f2a93b; padding:8px 20px; border-radius:30px;
  }
  .title { position:absolute; top:130px; left:66px; font-size:92px; font-weight:900; line-height:1.15; color:#fff; text-shadow:0 3px 14px rgba(0,0,0,0.25); }
  .title .l2 { color:#f6c46e; font-size:64px; margin-top:6px; }
  .subtitle { position:absolute; top:380px; left:68px; font-size:27px; font-weight:700; color:#dfe4fb; line-height:1.65; }
  .footer-tag {
    position:absolute; bottom:56px; left:68px;
    font-size:19px; font-weight:700; color:#1f2a5c;
    background:rgba(255,255,255,0.92); padding:7px 18px; border-radius:24px;
  }
  .art { position:absolute; right:60px; bottom:46px; }
</style>
</head>
<body>

<div class="frame"></div>
<div class="pill">CGN 아침 예배</div>
<div class="title">
  <div>CGN 찬양팀</div>
  <div class="l2">섬김 기록</div>
</div>
<div class="subtitle">명단 · 월별 예배 담당<br>섬김 횟수 · 시간 · 포인트 결산</div>
<div class="footer-tag">cgn210-alt.github.io/cgn-praise</div>

<!-- 떠오르는 해 + 마이크 + 음표 -->
<svg class="art" width="500" height="470" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg">
  <!-- 햇살 -->
  <g stroke="rgba(246,196,110,0.55)" stroke-width="6" stroke-linecap="round">
    <line x1="250" y1="250" x2="250" y2="150" />
    <line x1="250" y1="250" x2="140" y2="190" />
    <line x1="250" y1="250" x2="360" y2="190" />
    <line x1="250" y1="250" x2="80"  y2="270" />
    <line x1="250" y1="250" x2="420" y2="270" />
  </g>
  <!-- 해 -->
  <path d="M110 330 A140 140 0 0 1 390 330 Z" fill="#f2a93b" />
  <path d="M150 330 A100 100 0 0 1 350 330 Z" fill="#f6c46e" />
  <rect x="30" y="330" width="440" height="6" rx="3" fill="rgba(255,255,255,0.6)" />
  <!-- 마이크 -->
  <rect x="215" y="180" width="70" height="120" rx="35" fill="#ffffff" />
  <g stroke="#c9d0f0" stroke-width="4">
    <line x1="222" y1="210" x2="278" y2="210" />
    <line x1="220" y1="232" x2="280" y2="232" />
    <line x1="222" y1="254" x2="278" y2="254" />
  </g>
  <path d="M190 260 Q190 340 250 340 Q310 340 310 260" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="250" y1="340" x2="250" y2="410" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="205" y1="414" x2="295" y2="414" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <!-- 음표 -->
  <g fill="#ffffff">
    <ellipse cx="88" cy="150" rx="22" ry="16" transform="rotate(-20 88 150)" />
    <rect x="104" y="58" width="8" height="92" />
    <path d="M108 58 Q140 70 146 104 Q132 84 112 80 Z" />
  </g>
  <g fill="#f6c46e">
    <ellipse cx="386" cy="104" rx="18" ry="13" transform="rotate(-20 386 104)" />
    <ellipse cx="446" cy="88"  rx="18" ry="13" transform="rotate(-20 446 88)" />
    <rect x="399" y="28" width="7" height="76" />
    <rect x="459" y="12" width="7" height="76" />
    <path d="M399 28 L466 12 L466 26 L399 42 Z" />
  </g>
</svg>

</body>
</html>
