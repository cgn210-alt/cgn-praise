<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<!-- 카카오톡 등 링크 공유 썸네일(praise-og.png) 원본. 1200x630 으로 캡처해서 PNG 로 저장 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Noto Sans KR', sans-serif;
    position:relative;
    color:#122a42;
    background:
      radial-gradient(620px 420px at 300px 690px, rgba(200,155,85,0.30), transparent 70%),
      radial-gradient(700px 500px at 1150px -120px, rgba(200,155,85,0.16), transparent 70%),
      linear-gradient(180deg, #fffdf8 0%, #f8f1e4 100%);
  }
  .frame { position:absolute; inset:22px; border:2px solid rgba(200,155,85,0.45); border-radius:18px; }
  .logo { position:absolute; left:70px; top:150px; width:520px; }
  .divider { position:absolute; left:640px; top:150px; width:2px; height:300px; background:linear-gradient(180deg, transparent, rgba(200,155,85,0.8), transparent); }
  .pill {
    position:absolute; top:150px; left:690px;
    font-size:18px; font-weight:700; letter-spacing:0.16em;
    color:#fff; background:#122a42; padding:8px 20px; border-radius:30px;
  }
  .phrase { position:absolute; top:212px; left:686px; font-weight:900; font-size:70px; line-height:1.28; letter-spacing:-0.03em; }
  .phrase .l2 { color:#b8863c; }
  .en { position:absolute; top:392px; left:690px; font-size:22px; font-weight:500; font-style:italic; color:#a8793a; letter-spacing:0.01em; }
  .sub { position:absolute; top:410px; left:690px; font-size:24px; font-weight:500; color:#4a5a6e; line-height:1.6; }
  .footer-tag {
    position:absolute; bottom:52px; left:70px;
    font-size:19px; font-weight:700; color:#122a42;
    background:rgba(255,255,255,0.85); border:1px solid rgba(200,155,85,0.5); padding:6px 18px; border-radius:24px;
  }
</style>
</head>
<body>

<div class="frame"></div>
<img class="logo" src="em1-logo.png" alt="EM1 Every morning, for the One alone" />
<div class="divider"></div>
<div class="pill">CGN 찬양팀</div>
<div class="phrase">
  <div>매일 아침,</div>
  <div class="l2">오직 한 분께</div>
</div>
<div class="sub">명단 · 월별 예배 담당 · 섬김 기록</div>
<div class="footer-tag">cgn210-alt.github.io/cgn-praise</div>

</body>
</html>
